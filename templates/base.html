<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="汇集公开性能、任务活动与原文来源的海上无人补给与作战平台数字图鉴">
  <meta name="theme-color" content="#102d3c">
  <title>{% block title %}海上无人补给 / 作战平台资料库{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="{{ url_for('index') }}" aria-label="返回平台目录首页">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span><strong>海上无人平台</strong><small>数字图鉴与证据索引</small></span>
      </a>
      <button class="nav-toggle icon-button" type="button" data-nav-toggle aria-expanded="false" aria-controls="primary-nav"><span class="sr-only">打开导航</span><span aria-hidden="true">☰</span></button>
      <nav class="primary-nav" id="primary-nav" aria-label="主要导航">
        <a href="{{ url_for('index') }}">平台目录</a>
        <a href="{{ url_for('compare') }}" data-nav-compare>装备对比 <span class="nav-count" data-compare-count>0</span></a>
        <a href="{{ url_for('about') }}#data">数据说明</a>
        <a href="{{ url_for('about') }}#labels">标签说明</a>
        <a href="{{ url_for('about') }}">关于项目</a>
      </nav>
      <form class="nav-search" action="{{ url_for('index') }}" method="get" role="search">
        <label class="sr-only" for="nav-q">搜索平台</label>
        <input id="nav-q" type="search" name="q" placeholder="搜索平台或任务" value="{{ request.args.get('q', '') }}">
        <button type="submit">搜索</button>
      </form>
    </div>
  </header>

  <main id="main-content">{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div class="page-shell footer-grid">
      <div><strong>海上无人补给 / 作战平台资料库</strong><p>公开性能、任务活动与来源入口的研究型索引。</p></div>
      <div class="footer-links"><a href="{{ url_for('about') }}#data">数据口径</a><a href="{{ url_for('about') }}#license">开源说明</a><span>数据快照 2026-09-23</span></div>
    </div>
  </footer>

  <section class="compare-dock" data-compare-bar data-compare-url="{{ url_for('compare') }}" hidden aria-label="装备对比选择栏">
    <div class="compare-dock-inner">
      <div class="compare-summary"><strong>已选择 <span data-compare-count>0</span> 个平台</strong><span class="compare-message" data-compare-message aria-live="polite">请选择 2–4 个平台</span></div>
      <div class="compare-chips" data-compare-chips></div>
      <div class="compare-actions"><button type="button" class="button button-ghost button-small" data-compare-clear>清空</button><a class="button button-primary button-small" href="{{ url_for('compare') }}" data-compare-start aria-disabled="true">开始对比</a></div>
    </div>
  </section>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/compare.js') }}"></script>
</body>
</html>
